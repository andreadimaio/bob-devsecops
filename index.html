<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>BobBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bank-blue { background-color: #002244; }
        @keyframes pulse-red {
            0%, 100% { background-color: rgba(254, 226, 226, 1); }
            50% { background-color: rgba(248, 113, 113, 0.4); }
        }
        .leak-alert { animation: pulse-red 1.5s infinite; }

        #clear-btn {
            display: none;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 18px;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 50%;
            transition: color 0.2s, background 0.2s;
        }
        #clear-btn:hover {
            color: #475569;
            background: #e2e8f0;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <header class="bank-blue p-6 text-white shadow-2xl flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black tracking-tighter">Bob Bank <span class="text-blue-400 font-light">| Customer Portal</span></h1>
        </div>
    </header>

    <main class="max-w-6xl mx-auto py-12 px-4">
        
        <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-200 mb-10">
            <h2 class="text-lg font-bold text-slate-700 mb-4">Ricerca Clienti</h2>
            <div class="flex gap-4">
                <div class="relative flex-1">
                    <input type="text" id="query-input" 
                           placeholder="Cerca per nome cliente..." 
                           oninput="toggleClear()"
                           class="w-full p-4 bg-slate-100 border-2 border-transparent rounded-2xl focus:border-blue-500 focus:bg-white outline-none transition-all text-lg pr-10">
                    <button id="clear-btn" onclick="clearInput()" title="Cancella">✕</button>
                </div>
                <button onclick="runDemoQuery()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-2xl font-bold shadow-lg transition-transform active:scale-95">
                    CERCA
                </button>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
            <table class="w-full text-left">
                <thead>
                    <tr class="bg-slate-800 text-white text-xs uppercase tracking-widest">
                        <th class="p-5">ID</th>
                        <th class="p-5">Nome</th>
                        <th class="p-5">Email</th>
                        <th class="p-5">Note / Stato</th>
                    </tr>
                </thead>
                <tbody id="db-results" class="divide-y divide-slate-100">
                    <tr>
                        <td colspan="4" class="p-20 text-center text-slate-400 italic font-light">
                            In attesa di query al database...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        function toggleClear() {
            const val = document.getElementById('query-input').value;
            document.getElementById('clear-btn').style.display = val.length > 0 ? 'block' : 'none';
        }

        function clearInput() {
            document.getElementById('query-input').value = '';
            document.getElementById('clear-btn').style.display = 'none';
            document.getElementById('query-input').focus();
        }

        async function runDemoQuery() {
            const val = document.getElementById('query-input').value;
            const tbody = document.getElementById('db-results');
            
            tbody.innerHTML = `<tr><td colspan="4" class="p-20 text-center text-blue-500 font-bold animate-pulse">ESECUZIONE QUERY HQL...</td></tr>`;

            try {
                const response = await fetch(`http://localhost:8080/users/search?query=${encodeURIComponent(val)}`);
                
                if (!response.ok) throw new Error("Database Interpretation Error (500)");

                const data = await response.json();

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-20 text-center text-slate-400 italic">Nessun risultato trovato.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(item => {
                    const isLeaked = !item.email || !item.email.includes('@') || item.email.includes('IT') || item.id > 100;
                    const rowClass = isLeaked ? "leak-alert" : "hover:bg-slate-50";
                    const textClass = isLeaked ? "text-red-600 font-black" : "text-slate-700 font-medium";
                    const labelClass = isLeaked ? "bg-red-600 text-white" : "bg-blue-100 text-blue-700";

                    return `
                        <tr class="${rowClass} transition-colors">
                            <td class="p-5 font-mono text-sm text-slate-400">#${item.id}</td>
                            <td class="p-5 ${textClass}">${item.fullName || item.name || 'N/A'}</td>
                            <td class="p-5 font-mono text-sm ${textClass}">${item.email || 'N/A'}</td>
                            <td class="p-5">
                                <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter ${labelClass}">
                                    ${isLeaked ? '⚠️ SECURITY LEAK' : 'REGULAR_USER'}
                                </span>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="p-12 bg-amber-50">
                            <div class="border-2 border-amber-500 p-6 rounded-2xl text-center">
                                <h3 class="text-amber-800 font-black">CRITICAL: HQL_PARSER_EXCEPTION</h3>
                                <p class="text-amber-600 font-mono text-xs mt-2 italic">${err.message}</p>
                                <p class="text-slate-500 text-[10px] mt-4 uppercase">IBM Bob ha previsto questa instabilità durante la fase di coding.</p>
                            </div>
                        </td>
                    </tr>`;
            }
        }

        function setPayload(type) {
            const input = document.getElementById('query-input');
            if(type === 1) {
                input.value = "Inesistente' UNION SELECT id, project_name, CAST(revenue AS varchar), 'HACK' FROM PROJECTS --";
            } else {
                input.value = "Inesistente' UNION SELECT id, full_name, iban, 'HACK' FROM CUSTOMERS --";
            }
            toggleClear();
            input.focus();
        }
    </script>
</body>
</html>
