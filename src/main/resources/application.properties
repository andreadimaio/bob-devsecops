# Database Configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:h2:mem:default;NON_KEYWORDS=VALUE,KEY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}

# Hibernate Configuration
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.sql-load-script=import.sql

# Dev-only datasource credentials (never used in production)
%dev.quarkus.datasource.username=admin
%dev.quarkus.datasource.password=test

# Security Configuration
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Application Configuration
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=Content-Type,Accept,Authorization
quarkus.http.cors.origins=${CORS_ORIGINS}