name: CI

on:
  pull_request:
    branches: ["**"]

jobs:

  security-review:
    name: IBM Bob Security Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: bob_cache
        uses: actions/cache@v4
        with:
          path: ~/.bob
          key: bob-${{ runner.os }}-latest
          restore-keys: bob-${{ runner.os }}-

      - name: Install IBM Bob Shell
        if: steps.bob_cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash -s -- --pm npm

      - name: Configure IBM Bob
        run: |
          echo "$HOME/.bob/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bob/bin:$PATH"
          bob run --accept-license "License accepted"
        env:
          BOB_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}

      - name: Analyse PR diff for security vulnerabilities
        id: bob_review
        run: |
          export PATH="$HOME/.bob/bin:$PATH"
          bob run \
            --mode security-review-ci \
            --format json \
            --trust \
            --accept-license \
            "Use the pr-security-review skill to analyse this pull request. The base branch is '$BASE_BRANCH'. Follow all steps exactly as documented." \
            2>&1 | tee bob_raw.txt

          jq -r '.last_message' bob_raw.txt > pr_comment_raw.md

          START=$(grep -n '[✅❌]' pr_comment_raw.md | head -1 | cut -d: -f1)
          if [ -n "$START" ]; then
            tail -n +"$START" pr_comment_raw.md > pr_comment.md
          else
            echo "❌ Bob did not produce a valid review comment:"; cat bob_raw.txt; exit 1
          fi

          grep -qE 'Security Review\s*[—-]\s*FAIL' pr_comment.md \
            && echo "verdict=FAIL" >> "$GITHUB_OUTPUT" \
            || echo "verdict=PASS" >> "$GITHUB_OUTPUT"
        env:
          BOB_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}

      - name: Post security review comment on PR
        if: always() && steps.bob_review.outcome == 'success'
        run: gh pr comment "$PR_NUMBER" --body-file pr_comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Save Bob output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bob-security-review
          path: bob_raw.txt
          retention-days: 30

      - name: Block pipeline if security issues were found
        if: steps.bob_review.outcome == 'success'
        run: |
          grep -qE 'Security Review\s*[—-]\s*FAIL' pr_comment.md \
            && { echo "❌ Security review failed. See PR comment for details."; exit 1; } || true

  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: security-review

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test
        env:
          DB_URL: jdbc:h2:mem:default;NON_KEYWORDS=VALUE,KEY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
